name: build-apk

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # на корпоративном раннере — замени на свой label (нужны JDK 17 и Android SDK 35)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # На ubuntu-latest Android SDK уже установлен. Шаг нужен для раннеров без SDK:
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameSteps-SpeedSim-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
